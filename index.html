<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0a08" />
    <meta name="description" content="楚河汉界，谁主沉浮。四档 AI 难度、连吃 Combo、震屏特效与本地高分榜的中国象棋手游。" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="中国象棋" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./icons/icon-512.png" />
    <script>
      // 分享链接场景：给静态资源带上 sharecode，避免首次访问 403 影响安装
      (function () {
        var m = location.search.match(/[?&]sharecode=([^&]+)/);
        if (!m) return;
        var q = 'sharecode=' + encodeURIComponent(m[1]);
        document.querySelectorAll('link[rel="manifest"],link[rel="icon"],link[rel="apple-touch-icon"]').forEach(function (el) {
          var raw = el.getAttribute('href');
          if (!raw) return;
          el.href = raw + (raw.indexOf('?') >= 0 ? '&' : '?') + q;
        });
      })();
    </script>
    <title>中国象棋 · 掌上对弈</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
